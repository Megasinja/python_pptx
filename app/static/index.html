      function applyViewportTranslation(deltaX, deltaY, render = true) {
        if (!board || !board.viewportTransform) return;
        board.viewportTransform[4] += deltaX;
        board.viewportTransform[5] += deltaY;
        if (render) {
          board.requestRenderAll();
        }
      }

      function panViewportByWheel(deltaX, deltaY) {
        applyViewportTranslation(-deltaX, -deltaY);
      }

      function screenToWorldPoint(screenX, screenY) {
        if (!board || !window.fabric) return { x: 0, y: 0 };
        const matrix = board.viewportTransform || [1, 0, 0, 1, 0, 0];
        const inverseMatrix = window.fabric.util.invertTransform(matrix);
        const point = window.fabric.util.transformPoint(
          new window.fabric.Point(screenX, screenY),
          inverseMatrix
        );
        return { x: point.x, y: point.y };
      }

      function getViewportCenterWorldPoint() {
        if (!board) return { x: 0, y: 0 };
        return screenToWorldPoint(board.getWidth() / 2, board.getHeight() / 2);
      }

      function resetViewportToCenter() {
        if (!board || !board.viewportTransform) return;
        canvasZoom = 1;
        board.viewportTransform[0] = 1;
        board.viewportTransform[1] = 0;
        board.viewportTransform[2] = 0;
        board.viewportTransform[3] = 1;
        board.viewportTransform[4] = board.getWidth() / 2;
        board.viewportTransform[5] = board.getHeight() / 2;
        zoomValueEl.textContent = "100%";
        board.requestRenderAll();
      }

      function getTouchPoint(touch) {
        const rect = canvasWrap.getBoundingClientRect();
        return {
          x: touch.clientX - rect.left,
          y: touch.clientY - rect.top,
        };
      }

      function getMidpoint(first, second) {
        return {
          x: (first.x + second.x) / 2,
          y: (first.y + second.y) / 2,
        };
      }

      function getDistance(first, second) {
        const dx = first.x - second.x;
        const dy = first.y - second.y;
        return Math.sqrt(dx * dx + dy * dy);
      }

      function hideLaserDot() {
        laserDotEl.classList.remove("visible");
        laserDotEl.style.left = "-100px";
        laserDotEl.style.top = "-100px";
      }

      function placeLaserDot(clientX, clientY) {
        const rect = canvasWrap.getBoundingClientRect();
        laserDotEl.style.left = `${clientX - rect.left}px`;
        laserDotEl.style.top = `${clientY - rect.top}px`;
        laserDotEl.classList.add("visible");
      }

      function updateCanvasToolButtons() {
        selectToolBtn.classList.toggle("active", boardMode === "select");
        penToolBtn.classList.toggle("active", boardMode === "pen");
        laserToolBtn.classList.toggle("active", boardMode === "laser");
      }

      function setObjectsInteractive(enabled) {
        if (!board) return;

        board.selection = enabled;
        board.skipTargetFind = !enabled;
        if (!enabled) {
          board.discardActiveObject();
        }
        board.forEachObject((obj) => {
          obj.selectable = enabled;
          obj.evented = enabled;
          if (obj.type === "textbox") {
            obj.editable = enabled;
          }
          obj.hoverCursor = enabled ? "move" : "default";
        });
      }

      function setCanvasMode(mode) {
        if (!board) return;

        const nextMode = mode === "pen" || mode === "laser" ? mode : "select";
        boardMode = nextMode;
        board.isDrawingMode = boardMode === "pen";

        if (boardMode === "select") {
          setObjectsInteractive(true);
          canvasWrap.classList.remove("laser-active");
          hideLaserDot();
        } else if (boardMode === "pen") {
          setObjectsInteractive(false);
          canvasWrap.classList.remove("laser-active");
          hideLaserDot();
          if (board.freeDrawingBrush) {
            board.freeDrawingBrush.color = "#2c65f5";
            board.freeDrawingBrush.width = Number(brushSizeInput.value || 4);
          }
        } else {
          setObjectsInteractive(false);
          canvasWrap.classList.add("laser-active");
        }

        updateCanvasToolButtons();
        board.requestRenderAll();
      }

      function applyCanvasZoom(value, focusPoint = null) {
        if (!board || !window.fabric) return;

        canvasZoom = clampCanvasZoom(value);
        const nextFocus =
          focusPoint instanceof window.fabric.Point
            ? focusPoint
            : new window.fabric.Point(board.getWidth() / 2, board.getHeight() / 2);
        board.zoomToPoint(nextFocus, canvasZoom);
        zoomValueEl.textContent = `${Math.round(canvasZoom * 100)}%`;
        board.requestRenderAll();
      }

      function resizeBoardToWrapper() {
        if (!board) return;

        const rect = canvasWrap.getBoundingClientRect();
        const nextWidth = Math.max(320, Math.floor(rect.width));
        const nextHeight = Math.max(220, Math.floor(rect.height));
        if (nextWidth === boardWidth && nextHeight === boardHeight) return;

        const previousWidth = boardWidth;
        const previousHeight = boardHeight;

        board.setWidth(nextWidth);
        board.setHeight(nextHeight);

        boardWidth = nextWidth;
        boardHeight = nextHeight;

        if (previousWidth <= 0 || previousHeight <= 0) {
          resetViewportToCenter();
        } else {
          const offsetX = (nextWidth - previousWidth) / 2;
          const offsetY = (nextHeight - previousHeight) / 2;
          applyViewportTranslation(offsetX, offsetY, false);
          board.requestRenderAll();
        }

        board.requestRenderAll();
        updateCanvasHint();
      }

      function addTextBox() {
        if (!board || !window.fabric) return;

        const center = getViewportCenterWorldPoint();
        const text = new window.fabric.Textbox("テキスト", {
          left: center.x - 110,
          top: center.y - 30,
          width: 220,
          fontSize: 30,
          fontWeight: "700",
          fill: "#11233f",
          backgroundColor: "rgba(255,255,255,0.55)",
          borderColor: "#1d4ed8",
          cornerColor: "#1d4ed8",
          cornerStyle: "circle",
          transparentCorners: false,
          editable: true,
        });
        applyBoardObjectStyle(text);
        board.add(text);
        board.setActiveObject(text);
        setCanvasMode("select");
        updateCanvasHint();
      }

      function buildMarkdownSourceId() {
        markdownSourceSequence += 1;
        return `md-source-${Date.now()}-${markdownSourceSequence}`;
      }

      function getOrAssignMarkdownSourceId(object) {
        if (!object) return "";
        const existing = typeof object.markdownSourceId === "string" ? object.markdownSourceId.trim() : "";
        if (existing) return existing;
        const created = buildMarkdownSourceId();
        object.set("markdownSourceId", created);
        return created;
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function escapeXml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&apos;");
      }

      function extractDashSegments(line) {
        const text = String(line || "");
        if (!/^[\s-]+$/.test(text)) return null;
        const matches = Array.from(text.matchAll(/-{3,}/g));
        if (matches.length < 2) return null;
        return matches.map((match, index) => {
          const start = Number(match.index || 0);
          const nextMatch = matches[index + 1];
          const end = nextMatch ? Number(nextMatch.index || text.length) : text.length;
          return { start, end };
        });
      }

      function splitLineByDashSegments(line, segments) {
        const text = String(line || "");
        return segments.map((segment) =>
          String(text.slice(segment.start, segment.end === undefined ? text.length : segment.end)).trim()
        );
      }

      function parseDashTableAt(lines, startIndex) {
        if (startIndex < 0 || startIndex >= lines.length - 1) return null;
        const segments = extractDashSegments(lines[startIndex + 1]);
        if (!segments) return null;

        const header = splitLineByDashSegments(lines[startIndex], segments);
        if (!header.length || header.every((cell) => !cell)) return null;

        const rows = [];
        let index = startIndex + 2;
        while (index < lines.length) {
          const line = lines[index];
          if (!line.trim()) break;
          if (extractDashSegments(line)) break;

          const row = splitLineByDashSegments(line, segments);
          const hasAny = row.some((cell) => Boolean(cell));
          if (!hasAny) {
            index += 1;
            continue;
          }

          const lastCol = row.length - 1;
          const isContinuation =
            rows.length > 0 && row.slice(0, lastCol).every((cell) => !cell) && Boolean(row[lastCol]);
          if (isContinuation) {
            const previous = rows[rows.length - 1];
            previous[lastCol] = previous[lastCol] ? `${previous[lastCol]}\n${row[lastCol]}` : row[lastCol];
          } else {
            rows.push(row);
          }
          index += 1;
        }
        if (!rows.length) return null;

        if (index < lines.length && extractDashSegments(lines[index])) {
          index += 1;
        }
        return { header, rows, nextIndex: index };
      }

      function buildDashTableHtml(table) {
        if (!table || !Array.isArray(table.header) || !Array.isArray(table.rows)) return "";
        const thead = `<thead><tr>${table.header
          .map((cell) => `<th>${escapeHtml(cell)}</th>`)
          .join("")}</tr></thead>`;
        const tbodyRows = table.rows
          .map((row) => `<tr>${row.map((cell) => `<td>${escapeHtml(cell).replace(/\n/g, "<br />")}</td>`).join("")}</tr>`)
          .join("");
        return `<table>${thead}<tbody>${tbodyRows}</tbody></table>`;
      }

      function convertDashTablesToHtmlBlocks(markdownText) {
        const lines = String(markdownText || "").replace(/\r\n?/g, "\n").split("\n");
        const output = [];
        let index = 0;

        while (index < lines.length) {
          const parsed = parseDashTableAt(lines, index);
          if (!parsed) {
            output.push(lines[index]);
            index += 1;
            continue;
          }

          output.push("");
          output.push(buildDashTableHtml(parsed));
          output.push("");
          index = parsed.nextIndex;
        }

        return output.join("\n");
      }

      function markdownToSafeHtml(markdownText) {
        const normalized = convertDashTablesToHtmlBlocks(markdownText);
        let rawHtml = `<pre>${escapeHtml(normalized)}</pre>`;
        if (window.marked && typeof window.marked.parse === "function") {
          rawHtml = String(window.marked.parse(normalized, { gfm: true, breaks: true }));
        }

        if (window.DOMPurify && typeof window.DOMPurify.sanitize === "function") {
          return String(window.DOMPurify.sanitize(rawHtml, { USE_PROFILES: { html: true, mathMl: true } }));
        }
        return rawHtml.replace(/<script[\s\S]*?>[\s\S]*?<\/script>/gi, "");
      }

      function ensureMarkdownMeasureHost() {
        if (markdownMeasureHostEl && document.body.contains(markdownMeasureHostEl)) {
          return markdownMeasureHostEl;
        }
        const host = document.createElement("div");
        host.style.position = "fixed";
        host.style.left = "-99999px";
        host.style.top = "0";
        host.style.visibility = "hidden";
        host.style.pointerEvents = "none";
        host.style.zIndex = "-1";
        host.style.width = "320px";
        document.body.appendChild(host);
        markdownMeasureHostEl = host;
        return host;
      }

      function measureMarkdownHtmlBox(html, width) {
        const nextWidth = Math.max(280, Math.floor(width || 360));
        const host = ensureMarkdownMeasureHost();
        host.style.width = `${nextWidth}px`;
        host.innerHTML = `<style>${MARKDOWN_RENDER_THEME_CSS}</style><article class="md-render-root">${html}</article>`;
        const article = host.querySelector(".md-render-root");
        const height = Math.max(120, Math.ceil((article ? article.scrollHeight : host.scrollHeight) + 4));
        host.innerHTML = "";
        return { width: nextWidth, height };
      }

      function buildMarkdownSvgDataUrl(html, width, height) {
        const svg = `
<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
  <foreignObject x="0" y="0" width="${width}" height="${height}">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>${escapeXml(MARKDOWN_RENDER_THEME_CSS)}</style>
      <article class="md-render-root">${html}</article>
    </div>
  </foreignObject>
</svg>`;
        return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      }

      function getMarkdownSourceById(sourceId) {
        if (!board || !sourceId) return null;
        return (
          board
            .getObjects()
            .find((obj) => obj && obj.isMarkdownSource === true && obj.markdownSourceId === sourceId) || null
        );
      }

      function getMarkdownRenderBySourceId(sourceId) {
        if (!board || !sourceId) return null;
        return (
          board
            .getObjects()
            .find((obj) => obj && obj.isMarkdownRender === true && obj.markdownSourceId === sourceId) || null
        );
      }

      function removeMarkdownRenderObjectsForSource(sourceId, { internal = false } = {}) {
        if (!board || !sourceId) return;
        const staleObjects = board
          .getObjects()
          .filter((obj) => obj && obj.isMarkdownRender === true && obj.markdownSourceId === sourceId);
        staleObjects.forEach((obj) => {
          if (internal) obj.__mdInternalRemove = true;
          board.remove(obj);
        });
      }

      function bumpMarkdownRenderVersion(sourceId) {
        const nextVersion = Number(markdownRenderVersionBySourceId.get(sourceId) || 0) + 1;
        markdownRenderVersionBySourceId.set(sourceId, nextVersion);
        return nextVersion;
      }

      function syncMarkdownSourceGeometryFromRender(source, renderObj) {
        if (!source || !renderObj) return;
        const scaledWidth =
          typeof renderObj.getScaledWidth === "function"
            ? Number(renderObj.getScaledWidth() || renderObj.width || 360)
            : Number(renderObj.width || 360);
        source.set({
          left: Number(renderObj.left || 0),
          top: Number(renderObj.top || 0),
          angle: Number(renderObj.angle || 0),
          scaleX: 1,
          scaleY: 1,
          width: Math.max(220, Math.round(scaledWidth)),
        });
        source.setCoords();
      }

      function bindMarkdownRenderEvents(renderObj) {
        if (!renderObj || renderObj.isMarkdownRender !== true || renderObj.__mdEventsBound) return;
        renderObj.__mdEventsBound = true;
        renderObj.on("mousedblclick", () => {
          const source = getMarkdownSourceById(renderObj.markdownSourceId);
          if (!source) return;
          syncMarkdownSourceGeometryFromRender(source, renderObj);
          setMarkdownSourceEditMode(source, { focus: true });
        });
        renderObj.on("modified", () => {
          const source = getMarkdownSourceById(renderObj.markdownSourceId);
          if (!source) return;
          syncMarkdownSourceGeometryFromRender(source, renderObj);
        });
      }

      function renderMarkdownSourceToRight(source, { announce = false } = {}) {
        if (!board || !window.fabric || !source || source.isMarkdownSource !== true) return;
        if (!board.getObjects().includes(source)) return;

        const sourceId = getOrAssignMarkdownSourceId(source);
        const renderVersion = bumpMarkdownRenderVersion(sourceId);
        const markdownText = String(source.text || "");
        const safeHtml = markdownToSafeHtml(markdownText.trim() ? markdownText : "_(Markdownを入力してください)_");
        const sourceWidth =
          typeof source.getScaledWidth === "function"
            ? Number(source.getScaledWidth() || source.width || 360)
            : Number(source.width || 360);
        const renderWidth = Math.min(960, Math.max(300, Math.floor(sourceWidth)));
        const boxSize = measureMarkdownHtmlBox(safeHtml, renderWidth);
        const baseLeft = Number(source.left || 0);
        const baseTop = Number(source.top || 0);
        const svgDataUrl = buildMarkdownSvgDataUrl(safeHtml, boxSize.width, boxSize.height);

        window.fabric.Image.fromURL(
          svgDataUrl,
          (image) => {
            if (!board || !board.getObjects().includes(source)) return;
            if (Number(markdownRenderVersionBySourceId.get(sourceId) || 0) !== renderVersion) return;

            removeMarkdownRenderObjectsForSource(sourceId, { internal: true });
            image.set({
              left: baseLeft,
              top: baseTop,
              angle: Number(source.angle || 0),
              isMarkdownRender: true,
              markdownSourceId: sourceId,
              selectable: true,
              evented: true,
              visible: source.__mdViewMode !== "edit",
            });
            bindMarkdownRenderEvents(image);
            applyBoardObjectStyle(image);
            board.add(image);

            if (source.__mdViewMode !== "edit") {
              source.set({
                visible: false,
                selectable: false,
                evented: false,
              });
            } else {
              image.set({
                visible: false,
                selectable: false,
                evented: false,
              });
            }

            source.setCoords();
            image.setCoords();
            board.requestRenderAll();
            if (announce) {
              appendEvent("Markdownをレンダリングしました。");
            }
          },
          { crossOrigin: "anonymous" }
        );
      }

      function setMarkdownSourceEditMode(source, { focus = true } = {}) {
        if (!board || !source || source.isMarkdownSource !== true) return;
        const sourceId = getOrAssignMarkdownSourceId(source);
        const preview = getMarkdownRenderBySourceId(sourceId);
        source.__mdViewMode = "edit";
        source.set({
          visible: true,
          selectable: true,
          evented: true,
          editable: true,
        });
        if (preview) {
          syncMarkdownSourceGeometryFromRender(source, preview);
          preview.set({
            visible: false,
            selectable: false,
            evented: false,
          });
        }
        board.setActiveObject(source);
        source.setCoords();
        if (focus && typeof source.enterEditing === "function") {
          source.enterEditing();
          if (typeof source.selectAll === "function") {
            source.selectAll();
          }
        }
        board.requestRenderAll();
      }

      function setMarkdownSourcePreviewMode(source, { announce = false } = {}) {
        if (!board || !source || source.isMarkdownSource !== true) return;
        source.__mdViewMode = "preview";
        if (source.isEditing && typeof source.exitEditing === "function") {
          source.exitEditing();
        }
        renderMarkdownSourceToRight(source, { announce });
      }

      function bindMarkdownSourceEvents(source) {
        if (!source || source.isMarkdownSource !== true || source.__mdEventsBound) return;
        source.__mdEventsBound = true;
        source.on("editing:entered", () => {
          source.__mdViewMode = "edit";
          const preview = getMarkdownRenderBySourceId(source.markdownSourceId);
          if (preview) {
            preview.set({
              visible: false,
              selectable: false,
              evented: false,
            });
            board.requestRenderAll();
          }
        });
        source.on("editing:exited", () => {
          setMarkdownSourcePreviewMode(source);
        });
        source.on("modified", () => {
          renderMarkdownSourceToRight(source);
        });
        source.on("deselected", () => {
          if (source.__mdViewMode === "edit") {
            setMarkdownSourcePreviewMode(source);
          }
        });
        source.on("changed", () => {
          if (source.__mdRenderTimer) {
            window.clearTimeout(source.__mdRenderTimer);
          }
          source.__mdRenderTimer = window.setTimeout(() => {
            renderMarkdownSourceToRight(source);
          }, 260);
        });
      }

      function initializeMarkdownRenderingHooks() {
        if (!board) return;
        const objects = board.getObjects().slice();
        const markdownSources = [];

        objects.forEach((obj) => {
          if (!obj) return;
          if (obj.isMarkdownSource === true) {
            getOrAssignMarkdownSourceId(obj);
            bindMarkdownSourceEvents(obj);
            markdownSources.push(obj);
            return;
          }
          if (obj.isMarkdownRender === true) {
            obj.__mdInternalRemove = true;
            board.remove(obj);
          }
        });

        markdownSources.forEach((source) => {
          setMarkdownSourcePreviewMode(source);
        });
      }

      function addMarkdownBox() {
        if (!board || !window.fabric) return;

        const center = getViewportCenterWorldPoint();
        const markdownTemplate = [
          "# Markdownメモ",
          "",
          "> ここにMarkdownを書くと右側にプレビューします",
          "",
          "- 箇条書き",
          "- **太字** と `inline code`",
          "",
          "$\\frac{\\partial f}{\\partial a}$, $\\frac{\\partial f}{\\partial b}$",
          "",
          "```python",
          "print('hello markdown')",
          "```",
          "",
          "| 項目 | 値 |",
          "| --- | --- |",
          "| 例 | 123 |",
        ].join("\n");

        const markdownBox = new window.fabric.Textbox(markdownTemplate, {
          left: center.x - 220,
          top: center.y - 80,
          width: 360,
          fontSize: 18,
          fontFamily: "Menlo, Monaco, monospace",
          fontWeight: "500",
          fill: "#0f172a",
          lineHeight: 1.28,
          backgroundColor: "rgba(255,255,255,0.92)",
          borderColor: "#0284c7",
          cornerColor: "#0284c7",
          cornerStyle: "circle",
          transparentCorners: false,
          editable: true,
          isMarkdownSource: true,
          markdownSourceId: buildMarkdownSourceId(),
        });

        bindMarkdownSourceEvents(markdownBox);
        applyBoardObjectStyle(markdownBox);
        board.add(markdownBox);
        setMarkdownSourceEditMode(markdownBox, { focus: true });
        renderMarkdownSourceToRight(markdownBox, { announce: true });
        setCanvasMode("select");
        updateCanvasHint();
      }

      function addImageToBoard(file) {
        if (!board || !window.fabric || !file.type.startsWith("image/")) return;

        const reader = new FileReader();
        reader.onload = () => {
          window.fabric.Image.fromURL(
            String(reader.result),
            (image) => {
              const maxW = board.getWidth() * 0.65;
              const maxH = board.getHeight() * 0.65;
              const baseW = image.width || maxW;
              const baseH = image.height || maxH;
              const scale = Math.min(maxW / baseW, maxH / baseH, 1);

              const center = getViewportCenterWorldPoint();
              image.set({
                left: center.x - (baseW * scale) / 2,
                top: center.y - (baseH * scale) / 2,
              });
              applyBoardObjectStyle(image);
              image.scale(scale);
              board.add(image);
              board.setActiveObject(image);
              setCanvasMode("select");
              updateCanvasHint();
              board.requestRenderAll();
            },
            { crossOrigin: "anonymous" }
          );
        };
        reader.readAsDataURL(file);
      }

      function clearBoard() {
        if (!board) return;
        board.clear();
        board.setBackgroundColor("#f8fbff", board.renderAll.bind(board));
        resetViewportToCenter();
        setCanvasMode("select");
        updateCanvasHint();
      }

      function applyBoardObjectStyle(object) {
        if (!object) return;
        object.set({
          cornerColor: "#1d4ed8",
          borderColor: "#1d4ed8",
          cornerStyle: "circle",
          transparentCorners: false,
        });
      }

      function exportBoardAsJson() {
        if (!board) return;
        const currentPage = getActivePage();
        if (currentPage) {
          const snapshot = getBoardSnapshot();
          if (snapshot) currentPage.board = snapshot;
        }

        const payload = {
          schemaVersion: 1,
          exportedAt: new Date().toISOString(),
          board: board.toDatalessJSON(BOARD_SERIALIZE_PROPERTIES),
        };
        const jsonText = JSON.stringify(payload, null, 2);
        const blob = new Blob([jsonText], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
        anchor.href = url;
        anchor.download = `canvas-${timestamp}.json`;
        anchor.click();
        URL.revokeObjectURL(url);
        appendEvent("Canvas JSON を保存しました。");
      }

      function loadBoardFromSerialized(serialized, { announce = false } = {}) {
        if (!board) return;
        const safeSerialized =
          serialized && typeof serialized === "object" && Array.isArray(serialized.objects)
            ? deepCloneJson(serialized)
            : { objects: [] };

        board.loadFromJSON(
          safeSerialized,
          () => {
            board.setBackgroundColor("#f8fbff", board.renderAll.bind(board));
            board.getObjects().forEach((obj) => {
              applyBoardObjectStyle(obj);
              obj.setCoords();
            });
            initializeMarkdownRenderingHooks();
            setCanvasMode("select");
            applyCanvasZoom(1);
            board.requestRenderAll();
            updateCanvasHint();
            if (announce) {
              appendEvent("Canvas JSON を読み込みました。");
            }
          },
          (_serializedObject, object) => {
            applyBoardObjectStyle(object);
          }
        );
      }

      function importBoardFromJsonText(text, { announce = true } = {}) {
        try {
          const parsed = JSON.parse(text);
          const serialized = extractCanvasSerializedFromJsonValue(parsed);
          if (!serialized) {
            throw new Error("Invalid Canvas JSON format");
          }
          loadBoardFromSerialized(serialized, { announce });
          return serialized;
        } catch (_error) {
          appendConsole("[error] Canvas JSON の読み込みに失敗しました。\n", "stderr");
          return null;
        }
      }

      function initCanvasBoard() {
        if (!window.fabric) {
          appendEvent("Fabric.js を読み込めなかったため、Canvas拡張機能は無効です。");
          return;
        }

        board = new window.fabric.Canvas(canvasElement, {
          backgroundColor: "#f8fbff",
          preserveObjectStacking: true,
          selection: true,
        });
        board.freeDrawingBrush = new window.fabric.PencilBrush(board);
        board.freeDrawingBrush.color = "#2c65f5";
        board.freeDrawingBrush.width = Number(brushSizeInput.value || 4);

        board.on("object:added", (event) => {
          const target = event && event.target ? event.target : null;
          if (target && target.isMarkdownSource === true) {
            bindMarkdownSourceEvents(target);
          }
          updateCanvasHint();
        });
        board.on("object:removed", (event) => {
          const target = event && event.target ? event.target : null;
          if (target && target.isMarkdownSource === true) {
            const sourceId = getOrAssignMarkdownSourceId(target);
            if (target.__mdRenderTimer) {
              window.clearTimeout(target.__mdRenderTimer);
              target.__mdRenderTimer = null;
            }
            markdownRenderVersionBySourceId.delete(sourceId);
            removeMarkdownRenderObjectsForSource(sourceId, { internal: true });
            updateCanvasHint();
            return;
          }
          if (target && target.isMarkdownRender === true) {
            if (target.__mdInternalRemove === true) {
              target.__mdInternalRemove = false;
              updateCanvasHint();
              return;
            }
            const sourceId =
              typeof target.markdownSourceId === "string" ? target.markdownSourceId.trim() : "";
            if (sourceId) {
              markdownRenderVersionBySourceId.delete(sourceId);
              const source = getMarkdownSourceById(sourceId);
              if (source) {
                board.remove(source);
              }
            }
          }
          updateCanvasHint();
        });
        board.on("mouse:dblclick", (event) => {
          const target = event && event.target ? event.target : null;
          if (!target || target.isMarkdownRender !== true) return;
          const sourceId =
            typeof target.markdownSourceId === "string" ? target.markdownSourceId.trim() : "";
          if (!sourceId) return;
          const source = getMarkdownSourceById(sourceId);
          if (!source) return;
          syncMarkdownSourceGeometryFromRender(source, target);
          setMarkdownSourceEditMode(source, { focus: true });
        });
        board.on("path:created", updateCanvasHint);

        resizeBoardToWrapper();
        setCanvasMode("select");
        applyCanvasZoom(1);
        applyActivePageState({ announce: false });
      }

      fileInput.addEventListener("change", (event) => {
        const files = Array.from(event.target.files || []);
        files.forEach(addImageToBoard);
        event.target.value = "";
      });

      addMarkdownBtn.addEventListener("click", () => {
        addMarkdownBox();
      });

      addTextBtn.addEventListener("click", () => {
        addTextBox();
      });

      clearCanvasBtn.addEventListener("click", () => {
        clearBoard();
        const currentPage = getActivePage();
        if (currentPage) {
          const snapshot = getBoardSnapshot();
          currentPage.board = snapshot;
        }
      });

      selectToolBtn.addEventListener("click", () => {
        setCanvasMode("select");
      });

      penToolBtn.addEventListener("click", () => {
        setCanvasMode(boardMode === "pen" ? "select" : "pen");
      });

      laserToolBtn.addEventListener("click", () => {
        setCanvasMode(boardMode === "laser" ? "select" : "laser");
      });

      brushSizeInput.addEventListener("input", () => {
        if (board && board.freeDrawingBrush) {
          board.freeDrawingBrush.width = Number(brushSizeInput.value || 4);
        }
      });

      zoomInBtn.addEventListener("click", () => {
        applyCanvasZoom(canvasZoom * 1.15);
      });

      zoomOutBtn.addEventListener("click", () => {
        applyCanvasZoom(canvasZoom * 0.87);
      });

      resetZoomBtn.addEventListener("click", () => {
        applyCanvasZoom(1);
      });

      exportCanvasJsonBtn.addEventListener("click", () => {
        exportBoardAsJson();
      });

      importCanvasJsonInput.addEventListener("change", (event) => {
        const files = Array.from(event.target.files || []);
        const file = files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = () => {
          const serialized = importBoardFromJsonText(String(reader.result || ""));
          if (serialized) {
            const currentPage = getActivePage();
            if (currentPage) {
              currentPage.board = serialized;
            }
          }
        };
        reader.onerror = () => {
          appendConsole("[error] JSON ファイルの読み込みに失敗しました。\n", "stderr");
        };
        reader.readAsText(file, "utf-8");
        event.target.value = "";
      });

      canvasWrap.addEventListener(
        "wheel",
        (event) => {
          if (!board) return;
          event.preventDefault();
          const isZoomGesture = event.ctrlKey || event.metaKey;
          if (isZoomGesture) {
            const directionScale = event.deltaY < 0 ? 1.08 : 0.92;
            const focus = new window.fabric.Point(event.offsetX, event.offsetY);
            applyCanvasZoom(canvasZoom * directionScale, focus);
            return;
          }

          panViewportByWheel(event.deltaX, event.deltaY);
        },
        { passive: false }
      );

      canvasWrap.addEventListener(
        "touchstart",
        (event) => {
          if (!board || event.touches.length < 2) return;
          event.preventDefault();
          const first = getTouchPoint(event.touches[0]);
          const second = getTouchPoint(event.touches[1]);
          touchGesture = {
            startDistance: Math.max(1, getDistance(first, second)),
            startZoom: canvasZoom,
            lastMidpoint: getMidpoint(first, second),
          };
        },
        { passive: false }
      );

      canvasWrap.addEventListener(
        "touchmove",
        (event) => {
          if (!board || event.touches.length < 2) return;
          event.preventDefault();
          const first = getTouchPoint(event.touches[0]);
          const second = getTouchPoint(event.touches[1]);
          const midpoint = getMidpoint(first, second);
          const distance = Math.max(1, getDistance(first, second));

          if (!touchGesture) {
            touchGesture = {
              startDistance: distance,
              startZoom: canvasZoom,
              lastMidpoint: midpoint,
            };
          }

          const zoomFactor = distance / Math.max(1, touchGesture.startDistance);
          const targetZoom = touchGesture.startZoom * zoomFactor;
          applyCanvasZoom(targetZoom, new window.fabric.Point(midpoint.x, midpoint.y));

          const deltaX = midpoint.x - touchGesture.lastMidpoint.x;
          const deltaY = midpoint.y - touchGesture.lastMidpoint.y;
          applyViewportTranslation(deltaX, deltaY);

          touchGesture.lastMidpoint = midpoint;
        },
        { passive: false }
      );

      canvasWrap.addEventListener("touchend", (event) => {
        if (event.touches.length < 2) {
          touchGesture = null;
        }
      });

      canvasWrap.addEventListener("touchcancel", () => {
        touchGesture = null;
      });

      canvasWrap.addEventListener("dragover", (event) => {
        event.preventDefault();
        canvasWrap.classList.add("drag-over");
      });

      canvasWrap.addEventListener("dragleave", () => {
        canvasWrap.classList.remove("drag-over");
      });

      canvasWrap.addEventListener("drop", (event) => {
        event.preventDefault();
        canvasWrap.classList.remove("drag-over");
        const files = Array.from(event.dataTransfer?.files || []);
        files.forEach(addImageToBoard);
      });

      canvasWrap.addEventListener("pointermove", (event) => {
        if (boardMode !== "laser") return;
        placeLaserDot(event.clientX, event.clientY);
      });

      canvasWrap.addEventListener("pointerleave", () => {
        if (boardMode === "laser") hideLaserDot();
      });

      window.addEventListener("resize", () => {
        syncPaneSplitLayout();
        resizeBoardToWrapper();
      });

      initCanvasBoard();
    </script>
  </body>
</html>
