<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Python研修プロトタイプ</title>
    <style>
      :root {
        --bg-main: #f4f7fb;
        --panel: #ffffff;
        --line: #d8e1ee;
        --accent: #1d4ed8;
        --danger: #c81e1e;
        --text: #18212f;
        --muted: #566277;
        --menu-height: 52px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "BIZ UDPGothic", "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
        background: linear-gradient(130deg, #e8eef9, #f8fafc 42%, #edf5ff);
        color: var(--text);
      }

      body.resizing-col,
      body.resizing-col * {
        cursor: col-resize !important;
        user-select: none !important;
      }

      body.resizing-row,
      body.resizing-row * {
        cursor: row-resize !important;
        user-select: none !important;
      }

      [hidden] {
        display: none !important;
      }

      .shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .menu-bar {
        height: var(--menu-height);
        padding: 0 12px;
        display: flex;
        align-items: center;
        background: linear-gradient(180deg, #c9e0f6, #b9d6f2);
        border-bottom: 1px solid #98b9d7;
        user-select: none;
        position: relative;
        z-index: 30;
        overflow: visible;
      }

      .menu-list {
        display: flex;
        align-items: center;
        gap: 2px;
        width: 100%;
        overflow: visible;
      }

      .menu-title {
        font-weight: 800;
        font-size: 18px;
        padding: 0 10px;
        margin-right: 6px;
        white-space: nowrap;
      }

      .menu-item {
        border: 0;
        background: transparent;
        color: #0f1724;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        padding: 6px 10px;
        border-radius: 7px;
        white-space: nowrap;
      }

      .menu-item:hover,
      .menu-item.active {
        background: rgba(18, 32, 52, 0.13);
        cursor: pointer;
      }

      .menu-settings {
        position: relative;
        z-index: 60;
      }

      .settings-panel {
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        min-width: 260px;
        background: #ffffff;
        border: 1px solid #bdd0e8;
        border-radius: 10px;
        box-shadow: 0 14px 30px rgba(20, 34, 52, 0.2);
        padding: 10px;
        z-index: 80;
      }

      .settings-title {
        font-size: 12px;
        font-weight: 800;
        color: #4b5e78;
        letter-spacing: 0.04em;
        margin-bottom: 8px;
      }

      .settings-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #16233a;
        padding: 8px 6px;
        border-radius: 7px;
      }

      .settings-item:hover {
        background: #eef4ff;
      }

      .settings-item input {
        width: 16px;
        height: 16px;
      }

      .menu-panel-actions {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .menu-action {
        appearance: none;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: #16233a;
        font: inherit;
        text-align: left;
        font-size: 13px;
        font-weight: 700;
        padding: 8px 10px;
        cursor: pointer;
      }

      .menu-action:hover {
        background: #eef4ff;
      }

      .menu-note {
        margin-top: 6px;
        padding: 0 6px;
        font-size: 11px;
        line-height: 1.4;
        color: #60728b;
      }

      .app {
        display: grid;
        grid-template-columns: minmax(360px, 1.05fr) 12px minmax(320px, 0.95fr);
        gap: 0;
        height: calc(100vh - var(--menu-height));
        padding: 14px;
      }

      .pane {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(24, 33, 47, 0.08);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .left-pane {
        min-width: 360px;
      }

      .right-pane {
        min-width: 320px;
      }

      .pane-resize-handle {
        width: 12px;
        margin: 0 6px;
        border-radius: 10px;
        border: 1px solid #c4d4e8;
        background: linear-gradient(180deg, #edf3fd, #dfeaf8);
        cursor: col-resize;
        position: relative;
      }

      .pane-resize-handle::before {
        content: "";
        position: absolute;
        inset: 0;
        margin: auto;
        width: 2px;
        height: 52px;
        border-radius: 2px;
        background: #8fa8c6;
      }

      .pane-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        font-weight: 700;
      }

      .status-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .status {
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
      }

      .status.running {
        color: var(--accent);
      }

      .status.error {
        color: var(--danger);
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
      }

      .page-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
        background: #f8fbff;
      }

      .page-label {
        font-size: 12px;
        font-weight: 800;
        color: #27415f;
      }

      .page-select {
        min-width: 170px;
        max-width: 280px;
        flex: 1;
        height: 32px;
        border-radius: 7px;
        border: 1px solid #c3d3ea;
        background: #ffffff;
        color: #18212f;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        padding: 0 8px;
      }

      .connection-hint {
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
        color: #1d406f;
        background: #ecf3ff;
        font-size: 12px;
        line-height: 1.35;
      }

      .button {
        appearance: none;
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 8px 12px;
        font: inherit;
        font-weight: 700;
        background: #e9edf5;
        color: #1c2a3e;
        cursor: pointer;
      }

      .button:hover {
        filter: brightness(0.97);
      }

      .button.primary {
        background: var(--accent);
        color: #fff;
      }

      .button.danger {
        background: #f9e7e7;
        border-color: #f3cbcb;
        color: #8f1c1c;
      }

      .button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .editor {
        height: 100%;
        min-height: 0;
      }

      .monaco-editor .hover-comment-highlight {
        color: #6a9955 !important;
        font-style: normal !important;
      }

      .editor-fallback {
        width: 100%;
        height: 100%;
        border: 0;
        margin: 0;
        padding: 14px;
        resize: none;
        font-family: "UDEV Gothic 35NF", "Menlo", "Consolas", monospace;
        font-size: 14px;
        line-height: 1.5;
        color: #132033;
      }

      .console {
        min-height: 0;
        padding: 12px 14px;
        overflow: auto;
        background: #0d1726;
        color: #e7eefc;
        font-family: "UDEV Gothic 35NF", "Menlo", "Consolas", monospace;
        font-size: 13px;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      .console .stdout {
        color: #d9e6ff;
      }

      .console .stderr {
        color: #ffb5b5;
      }

      .console .event {
        color: #8fc5ff;
      }

      .console .plot-wrap {
        display: block;
        margin: 10px 0;
      }

      .console .plot-caption {
        display: block;
        color: #9fbbe8;
        font-size: 12px;
        margin-bottom: 4px;
      }

      .console .plot-image {
        display: block;
        max-width: 100%;
        height: auto;
        border: 1px solid #314867;
        border-radius: 8px;
        background: #ffffff;
      }

      .left-split-area {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-rows: minmax(180px, 56%) 10px minmax(140px, 1fr);
      }

      .editor-resize-handle {
        height: 10px;
        border-top: 1px solid #cad8ea;
        border-bottom: 1px solid #cad8ea;
        background: linear-gradient(180deg, #f1f6ff, #e5eefc);
        cursor: row-resize;
        position: relative;
      }

      .editor-resize-handle::before {
        content: "";
        position: absolute;
        inset: 0;
        margin: auto;
        width: 56px;
        height: 2px;
        border-radius: 2px;
        background: #8da4c1;
      }

      .canvas-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        background: #f7fbff;
      }

      .tool-group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        padding: 4px 6px;
        border: 1px solid #d7e3f3;
        border-radius: 8px;
        background: #ffffff;
        max-width: 100%;
      }

      .tool-button {
        appearance: none;
        border: 1px solid #c8d8ee;
        border-radius: 7px;
        background: #f5f8ff;
        color: #163156;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        padding: 6px 10px;
        cursor: pointer;
      }

      .tool-button:hover {
        filter: brightness(0.97);
      }

      .tool-button.active {
        background: #1d4ed8;
        border-color: #1d4ed8;
        color: #ffffff;
      }

      .zoom-value {
        min-width: 56px;
        text-align: center;
        font-size: 12px;
        font-weight: 800;
        color: #183258;
      }

      .brush-size {
        width: 92px;
      }

      .file-label {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .file-label input {
        display: none;
      }

      .canvas-wrap {
        position: relative;
        flex: 1;
        margin: 12px;
        border: 1px solid #c5d3e8;
        border-radius: 10px;
        overflow: hidden;
      }

      .canvas-wrap canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .canvas-wrap canvas.lower-canvas {
        background: #f8fbff;
      }

      .canvas-wrap canvas.upper-canvas {
        background: transparent !important;
      }

      .hint {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        pointer-events: none;
        color: #63708a;
        background: linear-gradient(45deg, rgba(255, 255, 255, 0.35), rgba(232, 241, 255, 0.35));
        font-size: 14px;
      }

      .hint.hidden {
        display: none;
      }

      .canvas-wrap.drag-over {
        outline: 2px dashed var(--accent);
        outline-offset: -6px;
      }

      .canvas-wrap.laser-active {
        cursor: none;
      }

      .laser-dot {
        position: absolute;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        pointer-events: none;
        border: 2px solid rgba(255, 255, 255, 0.9);
        background: #ff3131;
        box-shadow: 0 0 0 8px rgba(255, 49, 49, 0.25), 0 0 14px rgba(255, 49, 49, 0.8);
        transform: translate(-50%, -50%);
        left: -100px;
        top: -100px;
        opacity: 0;
        transition: opacity 80ms linear;
      }

      .laser-dot.visible {
        opacity: 1;
      }

      /* ── Jupyter Notebook styles ── */
      .notebook-toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-bottom: 1px solid var(--line);
        background: #f8fbff;
        flex-wrap: wrap;
      }

      .nb-tool-btn {
        appearance: none;
        border: 1px solid #c8d8ee;
        border-radius: 6px;
        background: #f5f8ff;
        color: #163156;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        padding: 5px 10px;
        cursor: pointer;
      }

      .nb-tool-btn:hover {
        background: #e8f0ff;
      }

      .nb-tool-btn.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      .nb-tool-btn.danger {
        color: #c81e1e;
        border-color: #f3cbcb;
        background: #fdf2f2;
      }

      .nb-tool-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .notebook-container {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 8px 0;
        background: #f4f7fb;
      }

      .nb-cell {
        margin: 4px 10px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        background: #fff;
        transition: border-color 0.15s;
        overflow: hidden;
      }

      .nb-cell:hover {
        border-color: #c0d0e4;
      }

      .nb-cell.selected {
        border-color: #1d4ed8;
      }

      .nb-cell.running {
        border-color: #16a34a;
      }

      .nb-cell-input-area {
        display: flex;
      }

      .nb-cell-prompt {
        width: 70px;
        min-width: 70px;
        padding: 10px 6px 10px 10px;
        text-align: right;
        font-family: "UDEV Gothic 35NF", "Menlo", "Consolas", monospace;
        font-size: 12px;
        font-weight: 700;
        color: #1d4ed8;
        user-select: none;
        line-height: 1.5;
        background: #f7f9fc;
      }

      .nb-cell.running .nb-cell-prompt {
        color: #16a34a;
      }

      .nb-cell-prompt.out-prompt {
        color: #c81e1e;
      }

      .nb-cell-editor-wrap {
        flex: 1;
        min-width: 0;
        position: relative;
      }

      .nb-cell-code {
        display: block;
        width: 100%;
        min-height: 56px;
        border: 0;
        margin: 0;
        padding: 8px 12px;
        resize: none;
        font-family: "UDEV Gothic 35NF", "Menlo", "Consolas", monospace;
        font-size: 14px;
        line-height: 1.5;
        color: #d9e6ff;
        background: #0d1726;
        tab-size: 4;
        outline: none;
        overflow: hidden;
      }

      .nb-cell-code:focus {
        box-shadow: inset 0 0 0 2px rgba(29, 78, 216, 0.45);
      }

      .nb-cell-actions {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 2px 6px;
        justify-content: flex-end;
        background: #f7f9fc;
        border-top: 1px solid #eef2f8;
      }

      .nb-cell-action-btn {
        appearance: none;
        border: none;
        background: transparent;
        color: #566277;
        font-size: 12px;
        font-weight: 700;
        padding: 3px 8px;
        cursor: pointer;
        border-radius: 4px;
        font-family: inherit;
      }

      .nb-cell-action-btn:hover {
        background: #e8f0ff;
        color: #1d4ed8;
      }

      .nb-cell-action-btn.run-btn {
        color: #16a34a;
      }

      .nb-cell-action-btn.run-btn:hover {
        background: #ecfdf5;
      }

      .nb-cell-output-area {
        display: flex;
        border-top: 1px solid #eef2f8;
      }

      .nb-cell-output-area:empty {
        display: none;
      }

      .nb-cell-output {
        flex: 1;
        min-width: 0;
        padding: 8px 12px;
        font-family: "UDEV Gothic 35NF", "Menlo", "Consolas", monospace;
        font-size: 13px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
        background: #fff;
        max-height: 400px;
        overflow-y: auto;
      }

      .nb-cell-output .stdout {
        color: #132033;
      }

      .nb-cell-output .stderr {
        color: #c81e1e;
      }

      .nb-cell-output .event {
        color: #1d4ed8;
        font-style: italic;
      }

      .nb-cell-output .plot-wrap {
        display: block;
        margin: 6px 0;
      }

      .nb-cell-output .plot-caption {
        display: block;
        color: #566277;
        font-size: 11px;
        margin-bottom: 2px;
      }

      .nb-cell-output .plot-image {
        display: block;
        max-width: 100%;
        height: auto;
        border: 1px solid #d8e1ee;
        border-radius: 6px;
        background: #ffffff;
      }

      .nb-add-cell-bar {
        display: flex;
        justify-content: center;
        padding: 8px 0;
      }

      .nb-add-cell-btn {
        appearance: none;
        border: 1px dashed #c8d8ee;
        border-radius: 6px;
        background: transparent;
        color: #566277;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        padding: 5px 20px;
        cursor: pointer;
      }

      .nb-add-cell-btn:hover {
        background: #e8f0ff;
        border-color: #1d4ed8;
        color: #1d4ed8;
      }

      .nb-kernel-indicator {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-left: auto;
        font-size: 11px;
        font-weight: 700;
        color: #566277;
      }

      .nb-kernel-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #94a3b8;
      }

      .nb-kernel-dot.connected {
        background: #16a34a;
      }

      .nb-kernel-dot.running {
        background: #f59e0b;
        animation: pulse-dot 1s infinite;
      }

      @keyframes pulse-dot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }

      @media (max-width: 980px) {
        .menu-title {
          font-size: 16px;
        }

        .menu-item {
          font-size: 13px;
        }

        .app {
          flex-direction: column;
          display: flex;
          height: auto;
          min-height: 100vh;
        }

        .pane-resize-handle {
          display: none;
        }

        .page-controls {
          flex-wrap: wrap;
        }

        .left-pane,
        .right-pane {
          min-width: 0;
          min-height: 44vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="menu-bar">
        <div class="menu-list">
          <span class="menu-title">Code</span>
          <div id="fileMenuWrap" class="menu-settings">
            <button id="fileTab" type="button" class="menu-item">File</button>
            <div id="filePanel" class="settings-panel" hidden>
              <div class="settings-title">FILE</div>
              <div class="menu-panel-actions">
                <button id="openFileAction" type="button" class="menu-action">ファイルを開く...</button>
                <button id="openFolderAction" type="button" class="menu-action">フォルダを開く...</button>
                <button id="openSetAction" type="button" class="menu-action">セットを開く...</button>
                <button id="saveSetAction" type="button" class="menu-action">セットを保存...</button>
              </div>
              <div class="menu-note">
                複数 `.py` / `.json` はページセットとして読み込みできます。
              </div>
              <input
                id="openFileInput"
                type="file"
                accept=".py,.json,application/json,text/plain"
                multiple
                hidden
              />
              <input
                id="openFolderInput"
                type="file"
                accept=".py,.json,application/json,text/plain"
                webkitdirectory
                directory
                multiple
                hidden
              />
              <input id="openSetInput" type="file" accept=".json,application/json" hidden />
            </div>
          </div>
          <button type="button" class="menu-item">Edit</button>
          <button type="button" class="menu-item">Selection</button>
          <button type="button" class="menu-item">View</button>
          <button type="button" class="menu-item">Go</button>
          <button type="button" class="menu-item">Run</button>
          <button type="button" class="menu-item">Terminal</button>
          <button type="button" class="menu-item">Window</button>
          <button type="button" class="menu-item">Help</button>
          <div id="settingsMenuWrap" class="menu-settings">
            <button id="settingsTab" type="button" class="menu-item">設定</button>
            <div id="settingsPanel" class="settings-panel" hidden>
              <div class="settings-title">EDITOR SETTINGS</div>
              <label class="settings-item">
                <input id="showAllCommentsToggle" type="checkbox" />
                コメントを常に表示（従来）
              </label>
            </div>
          </div>
        </div>
      </header>

      <main class="app">
        <section class="pane left-pane">
          <div class="pane-header">
            <span>Python Notebook</span>
            <div class="status-group">
              <span id="pythonInfo" class="status"></span>
              <span id="runStatus" class="status">接続中...</span>
              <div class="nb-kernel-indicator">
                <span id="kernelDot" class="nb-kernel-dot"></span>
                <span id="kernelLabel">Kernel</span>
              </div>
            </div>
          </div>
          <div class="notebook-toolbar">
            <button id="addCellBtn" class="nb-tool-btn" type="button">+ セル</button>
            <button id="runCellBtn" class="nb-tool-btn primary" type="button">▶ 実行</button>
            <button id="runAllBtn" class="nb-tool-btn" type="button">▶▶ 全実行</button>
            <button id="stopBtn" class="nb-tool-btn danger" type="button" disabled>⏹ 停止</button>
            <button id="clearAllOutputBtn" class="nb-tool-btn" type="button">出力クリア</button>
          </div>
          <div class="page-controls">
            <span class="page-label">ページ</span>
            <select id="pageSelect" class="page-select" aria-label="ページ切替"></select>
            <button id="addPageBtn" class="button" type="button">追加</button>
            <button id="removePageBtn" class="button" type="button">削除</button>
          </div>
          <div id="connectionHint" class="connection-hint">

    <script>
      const DEFAULT_CODE = `import time

      function configureMarkdownEngine() {

      const MARKDOWN_RENDER_THEME_CSS = `

      let socket = null;
      let running = false;
      let reconnectTimer = null;
      let reconnectAttempt = 0;
      let disconnectLogged = false;

      let workspacePages = [];
      let activePageIndex = -1;
      let pageSequence = 0;
      let leftPaneWidthPx = null;

      // Notebook / cell state
      let cellSequence = 0;
      let executionCount = 0;
      let selectedCellId = null;
      let runningCellId = null;
      let runAllQueue = [];

      function buildCellId() {
        cellSequence++;
        return `cell-${Date.now()}-${cellSequence}`;
      }

      function createCellData(code = "") {
        return {
          id: buildCellId(),
          code: String(code),
          outputs: [],
          executionCount: null,
        };
      }

      function setStatus(text, mode = "normal") {
        runStatusEl.textContent = text;
        runStatusEl.classList.remove("running", "error");
        if (mode === "running") runStatusEl.classList.add("running");
        if (mode === "error") runStatusEl.classList.add("error");
      }

      function appendCellOutput(cellId, outputItem) {
        const page = getActivePage();
        if (!page) return;
        const cell = page.cells.find((c) => c.id === cellId);
        if (cell) cell.outputs.push(outputItem);

        let outputEl = document.getElementById(`cell-output-${cellId}`);
        if (!outputEl) {
          const cellEl = notebookContainerEl.querySelector(`[data-cell-id="${cellId}"]`);
          if (!cellEl) return;
          let outputArea = cellEl.querySelector(".nb-cell-output-area");
          if (!outputArea) {
            outputArea = document.createElement("div");
            outputArea.className = "nb-cell-output-area";
            const outPrompt = document.createElement("div");
            outPrompt.className = "nb-cell-prompt out-prompt";
            outPrompt.textContent = cell && cell.executionCount != null ? `[${cell.executionCount}]:` : "";
            outputEl = document.createElement("div");
            outputEl.className = "nb-cell-output";
            outputEl.id = `cell-output-${cellId}`;
            outputArea.appendChild(outPrompt);
            outputArea.appendChild(outputEl);
            cellEl.appendChild(outputArea);
          } else {
            outputEl = outputArea.querySelector(".nb-cell-output");
          }
        }

        if (outputEl) {
          renderOutputItem(outputEl, outputItem);
        }
      }

      function renderOutputItem(container, outputItem) {
        if (outputItem.type === "stdout" || outputItem.type === "stderr" || outputItem.type === "event") {
          const span = document.createElement("span");
          span.className = outputItem.type;
          span.textContent = outputItem.content;
          container.appendChild(span);
        } else if (outputItem.type === "display_data") {
          const data = outputItem.data || {};
          if (typeof data["image/png"] === "string" && data["image/png"].length > 0) {
            const wrap = document.createElement("div");
            wrap.className = "plot-wrap";
            const img = document.createElement("img");
            img.className = "plot-image";
            img.alt = "display_data image/png";
            img.src = `data:image/png;base64,${data["image/png"]}`;
            wrap.appendChild(img);
            container.appendChild(wrap);
          } else if (typeof data["text/plain"] === "string") {
            const span = document.createElement("span");
            span.className = "stdout";
            span.textContent = data["text/plain"] + "\n";
            container.appendChild(span);
          }
        }
        const cellEl = container.closest(".nb-cell");
        if (cellEl) cellEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }

      function appendConsole(text, kind = "stdout") {
        if (runningCellId) {
          appendCellOutput(runningCellId, { type: kind, content: text });
          return;
        }
      }

      function appendEvent(text) {
        appendConsole(`[event] ${text}\n`, "event");
      }

      function finishCellExecution() {
        if (runningCellId) {
          const cellEl = notebookContainerEl.querySelector(`[data-cell-id="${runningCellId}"]`);
          if (cellEl) cellEl.classList.remove("running");
          runningCellId = null;
        }
        updateKernelIndicator();
        processRunAllQueue();
      }

      function updateKernelIndicator() {
        const connected = socket && socket.readyState === WebSocket.OPEN;
        kernelDotEl.classList.toggle("connected", connected && !running);
        kernelDotEl.classList.toggle("running", running);
        kernelLabelEl.textContent = running ? "Busy" : connected ? "Idle" : "Disconnected";
      }

      function autoResizeTextarea(textarea) {
        if (!textarea) return;
        textarea.style.height = "auto";
        textarea.style.height = Math.max(56, textarea.scrollHeight) + "px";
      }

      function selectCell(cellId) {
        selectedCellId = cellId;
        notebookContainerEl.querySelectorAll(".nb-cell").forEach((el) => {
          el.classList.toggle("selected", el.dataset.cellId === cellId);
        });
      }

      function captureCellCode(cellId) {
        const cellEl = notebookContainerEl.querySelector(`[data-cell-id="${cellId}"]`);
        if (!cellEl) return;
        const textarea = cellEl.querySelector(".nb-cell-code");
        if (!textarea) return;
        const page = getActivePage();
        if (!page) return;
        const cell = page.cells.find((c) => c.id === cellId);
        if (cell) cell.code = textarea.value;
      }

      function captureAllCellCodes() {
        const page = getActivePage();
        if (!page) return;
        page.cells.forEach((cell) => captureCellCode(cell.id));
      }

      function runCell(cellId) {
        if (!socket || socket.readyState !== WebSocket.OPEN) {
          appendCellOutput(cellId, { type: "stderr", content: "[error] WebSocket is not connected.\n" });
          return;
        }
        if (running) return;

        const page = getActivePage();
        if (!page) return;
        const cell = page.cells.find((c) => c.id === cellId);
        if (!cell) return;

        captureCellCode(cellId);
        if (!cell.code.trim()) return;

        cell.outputs = [];
        executionCount++;
        cell.executionCount = executionCount;
        runningCellId = cellId;

        const cellEl = notebookContainerEl.querySelector(`[data-cell-id="${cellId}"]`);
        if (cellEl) {
          cellEl.classList.add("running");
          const prompt = cellEl.querySelector(".nb-cell-prompt");
          if (prompt) prompt.textContent = `In [${executionCount}]:`;
          let outputArea = cellEl.querySelector(".nb-cell-output-area");
          if (outputArea) outputArea.remove();
          outputArea = document.createElement("div");
          outputArea.className = "nb-cell-output-area";
          const outPrompt = document.createElement("div");
          outPrompt.className = "nb-cell-prompt out-prompt";
          const outputContent = document.createElement("div");
          outputContent.className = "nb-cell-output";
          outputContent.id = `cell-output-${cellId}`;
          outputArea.appendChild(outPrompt);
          outputArea.appendChild(outputContent);
          cellEl.appendChild(outputArea);
        }

        updateKernelIndicator();
        socket.send(JSON.stringify({ type: "run", code: cell.code }));
      }

      function runAllCells() {
        const page = getActivePage();
        if (!page || page.cells.length === 0) return;
        captureAllCellCodes();
        runAllQueue = page.cells.map((c) => c.id).slice();
        processRunAllQueue();
      }

      function processRunAllQueue() {
        if (running || runAllQueue.length === 0) return;
        const nextCellId = runAllQueue.shift();
        if (nextCellId) runCell(nextCellId);
      }

      function clearAllOutputs() {
        const page = getActivePage();
        if (!page) return;
        page.cells.forEach((cell) => {
          cell.outputs = [];
          cell.executionCount = null;
        });
        renderNotebook();
      }

      function addNewCell(afterCellId = null) {
        const page = getActivePage();
        if (!page) return;
        captureAllCellCodes();

        const newCell = createCellData("");
        if (afterCellId) {
          const index = page.cells.findIndex((c) => c.id === afterCellId);
          if (index >= 0) {
            page.cells.splice(index + 1, 0, newCell);
          } else {
            page.cells.push(newCell);
          }
        } else {
          page.cells.push(newCell);
        }

        selectedCellId = newCell.id;
        renderNotebook();

        const cellEl = notebookContainerEl.querySelector(`[data-cell-id="${newCell.id}"]`);
        if (cellEl) {
          const textarea = cellEl.querySelector(".nb-cell-code");
          if (textarea) textarea.focus();
          cellEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
        }
      }

      function deleteCellById(cellId) {
        const page = getActivePage();
        if (!page || page.cells.length <= 1) return;
        captureAllCellCodes();

        const index = page.cells.findIndex((c) => c.id === cellId);
        if (index < 0) return;

        page.cells.splice(index, 1);
        if (selectedCellId === cellId) {
          selectedCellId = page.cells[Math.min(index, page.cells.length - 1)].id;
        }
        renderNotebook();
      }

      function createCellElement(cell) {
        const cellEl = document.createElement("div");
        cellEl.className = "nb-cell";
        cellEl.dataset.cellId = cell.id;
        if (cell.id === selectedCellId) cellEl.classList.add("selected");
        if (cell.id === runningCellId) cellEl.classList.add("running");

        // Input area
        const inputArea = document.createElement("div");
        inputArea.className = "nb-cell-input-area";

        const prompt = document.createElement("div");
        prompt.className = "nb-cell-prompt";
        prompt.textContent = cell.executionCount != null ? `In [${cell.executionCount}]:` : "In [ ]:";

        const editorWrap = document.createElement("div");
        editorWrap.className = "nb-cell-editor-wrap";

        const textarea = document.createElement("textarea");
        textarea.className = "nb-cell-code";
        textarea.value = cell.code;
        textarea.spellcheck = false;

        textarea.addEventListener("input", () => {
          cell.code = textarea.value;
          autoResizeTextarea(textarea);
        });

        textarea.addEventListener("keydown", (e) => {
          if (e.key === "Tab" && !e.shiftKey) {
            e.preventDefault();
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            textarea.value = textarea.value.substring(0, start) + "    " + textarea.value.substring(end);
            textarea.selectionStart = textarea.selectionEnd = start + 4;
            cell.code = textarea.value;
          }
          if (e.key === "Enter" && e.shiftKey) {
            e.preventDefault();
            runCell(cell.id);
          }
          if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            runCell(cell.id);
          }
        });

        textarea.addEventListener("focus", () => {
          selectCell(cell.id);
        });

        editorWrap.appendChild(textarea);
        inputArea.appendChild(prompt);
        inputArea.appendChild(editorWrap);
        cellEl.appendChild(inputArea);

        // Actions bar
        const actions = document.createElement("div");
        actions.className = "nb-cell-actions";

        const runBtn = document.createElement("button");
        runBtn.className = "nb-cell-action-btn run-btn";
        runBtn.textContent = "▶ 実行";
        runBtn.title = "Shift+Enter";
        runBtn.addEventListener("click", () => runCell(cell.id));

        const addBelowBtn = document.createElement("button");
        addBelowBtn.className = "nb-cell-action-btn";
        addBelowBtn.textContent = "+ 下に追加";
        addBelowBtn.addEventListener("click", () => addNewCell(cell.id));

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "nb-cell-action-btn";
        deleteBtn.textContent = "✕ 削除";
        deleteBtn.addEventListener("click", () => deleteCellById(cell.id));

        actions.appendChild(runBtn);
        actions.appendChild(addBelowBtn);
        actions.appendChild(deleteBtn);
        cellEl.appendChild(actions);

        // Output area
        if (cell.outputs.length > 0) {
          const outputArea = document.createElement("div");
          outputArea.className = "nb-cell-output-area";

          const outPrompt = document.createElement("div");
          outPrompt.className = "nb-cell-prompt out-prompt";
          outPrompt.textContent = cell.executionCount != null ? `[${cell.executionCount}]:` : "";

          const outputContent = document.createElement("div");
          outputContent.className = "nb-cell-output";
          outputContent.id = `cell-output-${cell.id}`;

          cell.outputs.forEach((out) => {
            renderOutputItem(outputContent, out);
          });

          outputArea.appendChild(outPrompt);
          outputArea.appendChild(outputContent);
          cellEl.appendChild(outputArea);
        }

        cellEl.addEventListener("click", (e) => {
          if (e.target === textarea) return;
          selectCell(cell.id);
        });

        requestAnimationFrame(() => autoResizeTextarea(textarea));
        return cellEl;
      }

      function renderNotebook() {
        const page = getActivePage();
        if (!page) return;
        captureAllCellCodes();
        notebookContainerEl.innerHTML = "";
        page.cells.forEach((cell) => {
          notebookContainerEl.appendChild(createCellElement(cell));
        });

        // Add cell bar at bottom
        const bar = document.createElement("div");
        bar.className = "nb-add-cell-bar";
        const btn = document.createElement("button");
        btn.className = "nb-add-cell-btn";
        btn.textContent = "+ セルを追加";
        btn.addEventListener("click", () => addNewCell());
        bar.appendChild(btn);
        notebookContainerEl.appendChild(bar);

        if (!selectedCellId && page.cells.length > 0) {
          selectCell(page.cells[0].id);
        }
      }

      function setFilePanelOpen(open) {
        filePanelEl.hidden = !open;
        fileTabEl.classList.toggle("active", open);
      }

      function setSettingsPanelOpen(open) {
        settingsPanelEl.hidden = !open;
        settingsTabEl.classList.toggle("active", open);
      }

      function deepCloneJson(value) {
        if (value === null || value === undefined) return null;
        return JSON.parse(JSON.stringify(value));
      }

      const APP_SPLITTER_WIDTH = 12;
      const APP_MIN_LEFT_WIDTH = 360;
      const APP_MIN_RIGHT_WIDTH = 320;
      const MOBILE_BREAKPOINT = 980;

      function clampNumber(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function isMobileLayout() {
        return window.matchMedia(`(max-width: ${MOBILE_BREAKPOINT}px)`).matches;
      }

      function applyPaneSplit(widthPx) {
        if (!appLayoutEl || isMobileLayout()) return;

        const totalWidth = Math.max(0, appLayoutEl.clientWidth);
        const minLeft = APP_MIN_LEFT_WIDTH;
        const maxLeft = totalWidth - APP_SPLITTER_WIDTH - APP_MIN_RIGHT_WIDTH;

        if (maxLeft <= minLeft) {
          appLayoutEl.style.gridTemplateColumns = `minmax(${APP_MIN_LEFT_WIDTH}px, 1fr) ${APP_SPLITTER_WIDTH}px minmax(${APP_MIN_RIGHT_WIDTH}px, 1fr)`;
          leftPaneWidthPx = minLeft;
          return;
        }

        const nextLeft = clampNumber(widthPx, minLeft, maxLeft);
        leftPaneWidthPx = nextLeft;
        appLayoutEl.style.gridTemplateColumns = `${nextLeft}px ${APP_SPLITTER_WIDTH}px minmax(${APP_MIN_RIGHT_WIDTH}px, 1fr)`;
      }

      function syncPaneSplitLayout() {
        if (!appLayoutEl) return;
        if (isMobileLayout()) {
          appLayoutEl.style.gridTemplateColumns = "";
          return;
        }
        const fallback = Math.round(appLayoutEl.clientWidth * 0.52);
        applyPaneSplit(leftPaneWidthPx || fallback);
      }

      function startPaneResize(event) {
        if (!paneResizeHandleEl || !leftPaneEl || isMobileLayout()) return;
        event.preventDefault();

        const startX = event.clientX;
        const startWidth = leftPaneWidthPx || leftPaneEl.getBoundingClientRect().width;
        document.body.classList.add("resizing-col");
        withOptionalPointerCapture(paneResizeHandleEl, event.pointerId, "set");

        const onMove = (moveEvent) => {
          const deltaX = moveEvent.clientX - startX;
          applyPaneSplit(startWidth + deltaX);
          resizeBoardToWrapper();
        };

        const cleanup = () => {
          document.body.classList.remove("resizing-col");
          withOptionalPointerCapture(paneResizeHandleEl, event.pointerId, "release");
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", cleanup);
          window.removeEventListener("pointercancel", cleanup);
          resizeBoardToWrapper();
        };

        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", cleanup);
        window.addEventListener("pointercancel", cleanup);
      }

      function withOptionalPointerCapture(target, pointerId, operation) {
        if (!target || typeof pointerId !== "number") return;
        try {
          if (operation === "set") {
            target.setPointerCapture(pointerId);
          } else {
            target.releasePointerCapture(pointerId);
          }
        } catch (_error) {
          // Pointer capture may fail in some browser states.
        }
      }

      function getLowerName(file) {
        return String(file && file.name ? file.name : "").toLowerCase();
      }

      function getFilePath(file) {
        return String(file && (file.webkitRelativePath || file.name) ? file.webkitRelativePath || file.name : "");
      }

      function stripFileExtension(name) {
        return String(name || "").replace(/\.[^./\\]+$/, "");
      }

      function sanitizePageName(name, fallback = "") {
        const normalized = String(name || "").trim() || String(fallback || "").trim();
        if (!normalized) {
          return `Page ${Math.max(1, workspacePages.length + 1)}`;
        }
        return normalized.slice(0, 80);
      }

      function extractCanvasSerializedFromJsonValue(value) {
        if (!value || typeof value !== "object") return null;
        if (Array.isArray(value.pages)) return null;

        const candidate =
          value.board && typeof value.board === "object" && !Array.isArray(value.board)
            ? value.board
            : value;
        if (!candidate || typeof candidate !== "object" || !Array.isArray(candidate.objects)) {
          return null;
        }
        return deepCloneJson(candidate);
      }

      function isPythonFile(file) {
        return getLowerName(file).endsWith(".py");
      }

      function isJsonFile(file) {
        return getLowerName(file).endsWith(".json");
      }

      function buildPageId() {
        pageSequence += 1;
        return `page-${Date.now()}-${pageSequence}`;
      }

      function createWorkspacePage({ name, code = "", cells = null, board = null } = {}) {
        const pageCells = cells && cells.length > 0
          ? cells.map((c) => createCellData(c.code || ""))
          : [createCellData(code || DEFAULT_CODE)];
        return {
          id: buildPageId(),
          name: sanitizePageName(name),
          cells: pageCells,
          board: extractCanvasSerializedFromJsonValue(board),
        };
      }

      function getActivePage() {
        if (activePageIndex < 0 || activePageIndex >= workspacePages.length) return null;
        return workspacePages[activePageIndex];
      }

      function refreshPageSelector() {
        pageSelectEl.innerHTML = "";
        workspacePages.forEach((page, index) => {
          const option = document.createElement("option");
          option.value = String(index);
          option.textContent = `${index + 1}. ${page.name}`;
          pageSelectEl.appendChild(option);
        });

        if (workspacePages.length === 0) {
          activePageIndex = -1;
          removePageBtn.disabled = true;
          return;
        }

        if (activePageIndex < 0 || activePageIndex >= workspacePages.length) {
          activePageIndex = 0;
        }
        pageSelectEl.value = String(activePageIndex);
        removePageBtn.disabled = workspacePages.length <= 1;
      }

      function getBoardSnapshot() {
        if (!board) return null;
        const serialized = board.toDatalessJSON(BOARD_SERIALIZE_PROPERTIES);
        if (!serialized || !Array.isArray(serialized.objects)) return null;
        return deepCloneJson(serialized);
      }

      function captureActivePageState() {
        const page = getActivePage();
        if (!page) return;
        captureAllCellCodes();
        const boardSnapshot = getBoardSnapshot();
        if (boardSnapshot) {
          page.board = boardSnapshot;
        }
      }

      function applyActivePageState({ announce = true } = {}) {
        const page = getActivePage();
        if (!page) return;

        selectedCellId = null;
        renderNotebook();
        if (board) {
          loadBoardFromSerialized(page.board, { announce: false });
        }
      }

      function switchToPage(index, { captureCurrent = true, announce = true } = {}) {
        if (!Number.isInteger(index) || index < 0 || index >= workspacePages.length) return;
        if (captureCurrent && index === activePageIndex) return;
        if (captureCurrent) {
          captureActivePageState();
        }

        activePageIndex = index;
        refreshPageSelector();
        applyActivePageState({ announce });
      }

      function replaceWorkspacePages(pages, sourceLabel = "セット") {
        const normalizedPages = Array.isArray(pages)
          ? pages.filter((page) => page && (page.code || page.cells || page.board))
          : [];
        if (!normalizedPages.length) return;

        workspacePages = normalizedPages.map((page, index) =>
          createWorkspacePage({
            name: sanitizePageName(page.name, `Page ${index + 1}`),
            code: page.code,
            cells: page.cells,
            board: page.board,
          })
        );
        activePageIndex = 0;
        refreshPageSelector();
        applyActivePageState({ announce: false });
      }

      function addWorkspacePage() {
        captureActivePageState();
        const nextPage = createWorkspacePage({
          name: `Page ${workspacePages.length + 1}`,
          code: DEFAULT_CODE,
          board: null,
        });
        workspacePages.push(nextPage);
        switchToPage(workspacePages.length - 1, { captureCurrent: false, announce: false });
      }

      function removeActiveWorkspacePage() {
        if (workspacePages.length <= 1) return;
        workspacePages.splice(activePageIndex, 1);
        if (activePageIndex >= workspacePages.length) {
          activePageIndex = workspacePages.length - 1;
        }
        refreshPageSelector();
        applyActivePageState({ announce: false });
      }

      function initializeWorkspacePages() {
        if (workspacePages.length > 0) return;
        workspacePages = [
          createWorkspacePage({
            name: "Page 1",
            code: DEFAULT_CODE,
            board: null,
          }),
        ];
        activePageIndex = 0;
        refreshPageSelector();
      }

      function readTextFromFile(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ""));
          reader.onerror = () => reject(new Error("Failed to read file"));
          reader.readAsText(file, "utf-8");
        });
      }

      async function importPythonFile(file) {
        const code = await readTextFromFile(file);
        const currentPage = getActivePage();
        if (currentPage) {
          if (currentPage.cells.length > 0) {
            currentPage.cells[0].code = code;
          } else {
            currentPage.cells.push(createCellData(code));
          }
          currentPage.name = sanitizePageName(stripFileExtension(file.name), currentPage.name);
          renderNotebook();
        }
        refreshPageSelector();
      }

      async function importJsonFile(file) {
        const jsonText = await readTextFromFile(file);

        let parsed;
        try {
          parsed = JSON.parse(jsonText);
        } catch (_error) {
          appendConsole("[error] JSON 解析に失敗しました。\n", "stderr");
          return;
        }

        if (parsed && Array.isArray(parsed.pages)) {
          importWorkspaceSetFromObject(parsed, file.name);
          return;
        }

        const serialized = extractCanvasSerializedFromJsonValue(parsed);
        if (!serialized) {
          appendConsole("[error] Canvas JSON の形式が不正です。\n", "stderr");
          return;
        }

        const currentPage = getActivePage();
        if (currentPage) {
          currentPage.board = serialized;
          currentPage.name = sanitizePageName(stripFileExtension(file.name), currentPage.name);
          refreshPageSelector();
        }

        loadBoardFromSerialized(serialized, { announce: false });
        appendEvent(`Canvas JSON を読み込みました: ${file.name}`);
      }

      function exportWorkspaceSet() {
        captureActivePageState();
        const payload = {
          schemaVersion: WORKSPACE_SET_SCHEMA_VERSION,
          kind: "python-canvas-pageset",
          exportedAt: new Date().toISOString(),
          pages: workspacePages.map((page, index) => ({
            name: sanitizePageName(page.name, `Page ${index + 1}`),
            code: page.cells.map((c) => c.code).join("\n"),
            cells: page.cells.map((c) => ({ code: c.code })),
            board: page.board ? deepCloneJson(page.board) : null,
          })),
        };

        const jsonText = JSON.stringify(payload, null, 2);
        const blob = new Blob([jsonText], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
        anchor.href = url;
        anchor.download = `workspace-set-${timestamp}.json`;
        anchor.click();
        URL.revokeObjectURL(url);
      }

      function importWorkspaceSetFromObject(value, sourceName = "セットJSON") {
        if (!value || typeof value !== "object" || !Array.isArray(value.pages)) return;

        const importedPages = value.pages
          .map((page, index) => {
            if (!page || typeof page !== "object") return null;
            const name = sanitizePageName(page.name, `Page ${index + 1}`);
            const code = typeof page.code === "string" ? page.code : "";
            const cells = Array.isArray(page.cells) ? page.cells : null;
            const board = extractCanvasSerializedFromJsonValue(page.board);
            return createWorkspacePage({ name, code, cells, board });
          })
          .filter(Boolean);

        if (!importedPages.length) return;
        replaceWorkspacePages(importedPages, `ページセット(${sourceName})`);
      }

      async function importWorkspaceSetFile(file) {
        const text = await readTextFromFile(file);
        let parsed;
        try {
          parsed = JSON.parse(text);
        } catch (_error) {
          appendConsole("[error] ページセットJSONの解析に失敗しました。\n", "stderr");
          return;
        }
        importWorkspaceSetFromObject(parsed, file.name);
      }

      async function buildWorkspacePagesFromFiles(fileList) {
        const entries = Array.from(fileList || [])
          .map((file) => ({ file, path: getFilePath(file) }))
          .filter((entry) => isPythonFile(entry.file) || isJsonFile(entry.file))
          .sort((a, b) => String(a.path).localeCompare(String(b.path)));

        const draftsByKey = new Map();
        for (const entry of entries) {
          const pairName = stripFileExtension(entry.path);
          const pairKey = pairName.toLowerCase();
          if (!draftsByKey.has(pairKey)) {
            draftsByKey.set(pairKey, {
              name: sanitizePageName(pairName, "Page"),
              code: "",
              board: null,
              hasContent: false,
            });
          }
          const draft = draftsByKey.get(pairKey);

          if (isPythonFile(entry.file)) {
            draft.code = await readTextFromFile(entry.file);
            draft.hasContent = true;
            continue;
          }

          if (isJsonFile(entry.file)) {
            const jsonText = await readTextFromFile(entry.file);
            try {
              const parsed = JSON.parse(jsonText);
              const board = extractCanvasSerializedFromJsonValue(parsed);
              if (board) {
                draft.board = board;
                draft.hasContent = true;
              } else {
                appendEvent(`Canvas形式でないJSONをスキップしました: ${entry.path}`);
              }
            } catch (_error) {
              appendConsole(`[error] JSON解析に失敗: ${entry.path}\n`, "stderr");
            }
          }
        }

        return Array.from(draftsByKey.values())
          .filter((draft) => draft.hasContent)
          .map((draft) =>
            createWorkspacePage({
              name: draft.name,
              code: draft.code,
              board: draft.board,
            })
          );
      }

      async function openFromFileSelection(fileList) {
        const files = Array.from(fileList || []);
        if (!files.length) return;

        const pyFiles = files.filter(isPythonFile);
        const jsonFiles = files.filter(isJsonFile);
        if (!pyFiles.length && !jsonFiles.length) {
          appendConsole("[error] .py または .json ファイルを選択してください。\n", "stderr");
          return;
        }

        if (files.length === 1 && pyFiles.length === 1) {
          await importPythonFile(pyFiles[0]);
          return;
        }
        if (files.length === 1 && jsonFiles.length === 1) {
          await importJsonFile(jsonFiles[0]);
          return;
        }

        const pages = await buildWorkspacePagesFromFiles(files);
        if (!pages.length) {
          appendConsole("[error] ページとして読み込めるファイルがありませんでした。\n", "stderr");
          return;
        }
        replaceWorkspacePages(pages, "選択ファイルセット");
      }

      async function openFromFolderSelection(fileList) {
        const files = Array.from(fileList || []);
        if (!files.length) return;

        const sorted = files
          .slice()
          .sort((a, b) =>
            String(a.webkitRelativePath || a.name).localeCompare(String(b.webkitRelativePath || b.name))
          );
        const pyFiles = sorted.filter(isPythonFile);
        const jsonFiles = sorted.filter(isJsonFile);

        if (!pyFiles.length && !jsonFiles.length) {
          appendConsole("[error] フォルダ内に .py / .json ファイルがありません。\n", "stderr");
          return;
        }

        const pages = await buildWorkspacePagesFromFiles(sorted);
        if (!pages.length) {
          appendConsole("[error] フォルダから有効なページを作成できませんでした。\n", "stderr");
          return;
        }
        replaceWorkspacePages(pages, "フォルダセット");
      }

      function updateButtons() {
        const connected = socket && socket.readyState === WebSocket.OPEN;
        runCellBtn.disabled = running || !connected;

        updateKernelIndicator();

      async function fetchHealth() {
        try {
          const response = await fetch("/api/health", { cache: "no-store" });
          if (!response.ok) return;
          const payload = await response.json();
          pythonInfoEl.textContent = `Python ${payload.pythonVersion}`;
        } catch (_error) {

      function scheduleReconnect() {
        if (reconnectTimer) return;
        reconnectAttempt += 1;
        const delay = Math.min(10000, 1000 * 2 ** Math.min(reconnectAttempt - 1, 3));
        setStatus(`未接続（${Math.round(delay / 1000)}秒後に再接続）`, "error");
        reconnectTimer = window.setTimeout(() => {
          reconnectTimer = null;
          connectSocket();
        }, delay);
      }

      function connectSocket() {
        if (!window.location.host || !window.location.protocol.startsWith("http")) {
          setStatus("サーバー経由で開いてください", "error");
          appendConsole(
            "[error] file:// では動作しません。`python -m uvicorn app.main:app --reload` 実行後に http://127.0.0.1:8000 を開いてください。\n",
            "stderr"
          );
          updateButtons();
          return;
        }

        if (socket && socket.readyState === WebSocket.OPEN) return;
        if (socket && socket.readyState === WebSocket.CONNECTING) return;

        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        socket = new WebSocket(`${protocol}//${window.location.host}/ws/run`);

        socket.addEventListener("open", () => {
          reconnectAttempt = 0;
          disconnectLogged = false;
          if (reconnectTimer) {
            window.clearTimeout(reconnectTimer);
            reconnectTimer = null;
          }
          setStatus("接続済み");
          fetchHealth();
          updateButtons();
        });

        socket.addEventListener("close", () => {
          running = false;
          finishCellExecution();
          updateButtons();
          scheduleReconnect();
        });

        socket.addEventListener("message", (event) => {
          let msg;
          try {
            msg = JSON.parse(event.data);
          } catch {
            return;
          }

          if (msg.type === "stdout") {
            if (runningCellId) {
              appendCellOutput(runningCellId, { type: "stdout", content: msg.data });
            }
            return;
          }

          if (msg.type === "stderr") {
            if (runningCellId) {
              appendCellOutput(runningCellId, { type: "stderr", content: msg.data });
            }
            return;
          }

          if (msg.type === "display_data") {
            if (runningCellId) {
              appendCellOutput(runningCellId, {
                type: "display_data",
                data: msg.data || {},
                metadata: msg.metadata || {},
              });
            }
            return;
          }

          if (msg.type === "plot") {
            if (runningCellId && msg.data) {
              appendCellOutput(runningCellId, {
                type: "display_data",
                data: { "image/png": msg.data },
              });
            }
            return;
          }

          if (msg.type === "error") {
            if (runningCellId) {
              appendCellOutput(runningCellId, { type: "stderr", content: `[error] ${msg.message}\n` });
            }
            setStatus("エラー", "error");
            running = false;
            finishCellExecution();
            updateButtons();
            return;
          }

          if (msg.type === "status") {
            if (msg.state === "started") {
              running = true;
              setStatus("実行中...", "running");
            } else if (msg.state === "aborting") {
              setStatus("停止処理中...", "running");
            } else if (msg.state === "aborted") {
              running = false;
              setStatus("停止しました");
              finishCellExecution();
            } else if (msg.state === "timeout") {
              running = false;
              setStatus("タイムアウト", "error");
              finishCellExecution();
            } else if (msg.state === "finished") {
              running = false;
              const rc = Number.isInteger(msg.returnCode) ? ` (code=${msg.returnCode})` : "";
              setStatus(`完了${rc}`);
              finishCellExecution();
            }
            updateButtons();
          }
        });
      }

      function isEditableDomTarget(target) {
        if (!(target instanceof HTMLElement)) return false;
        if (target.isContentEditable) return true;

        if (target.closest("input, textarea, select")) return true;

      function isCanvasTextEditing() {
        if (!board || typeof board.getActiveObject !== "function") return false;

      function deleteSelectedCanvasObjectsByBackspace(event) {
        if (event.key !== "Backspace") return false;
        if (!board) return false;
        if (isEditableDomTarget(event.target)) return false;
        if (isCodeEditorTextFocus()) return false;
        if (isCanvasTextEditing()) return false;

        const activeObjects =
          typeof board.getActiveObjects === "function"
            ? board.getActiveObjects().filter(Boolean)
            : [];
        if (activeObjects.length === 0) return false;

        event.preventDefault();
        event.stopPropagation();
        activeObjects.forEach((obj) => board.remove(obj));
        board.discardActiveObject();

      const MIN_CANVAS_ZOOM = 0.4;
      const MAX_CANVAS_ZOOM = 3.0;
      let board = null;
      let boardMode = "select";
      let boardWidth = 0;
      let boardHeight = 0;

      function clampCanvasZoom(value) {
        return Math.max(MIN_CANVAS_ZOOM, Math.min(MAX_CANVAS_ZOOM, value));

      function hasBoardContent() {
        return Boolean(board && board.getObjects().length > 0);
